<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <script>try{if(localStorage.getItem('theme')==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){}</script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Your dashboard | Sip &amp; Paint</title>
  <link rel="icon" href="assets/Sip%20%26%20Paint%20poster.jpeg" type="image/jpeg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,700;1,9..144,560&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="theme.css?v=2">
  <style>
    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem 1.15rem 2rem;
    }
    .shell { width: 100%; max-width: 460px; }
    .card {
      background: rgba(255, 250, 246, 0.95);
      border-radius: 28px;
      box-shadow: 0 18px 50px var(--shadow);
      padding: 1.6rem 1.4rem 1.3rem;
      text-align: center;
      border: 1px solid rgba(255,255,255,0.8);
    }
    .wordmark { font-size: 2.35rem; }
    .sub { color: var(--muted); margin: 0.35rem 0 1rem; line-height: 1.45; }
    label {
      display: block;
      text-align: center;
      font-size: 0.85rem;
      font-weight: 650;
      margin-bottom: 0.4rem;
    }
    input[type="text"] {
      width: 100%;
      padding: 0.95rem 1.05rem;
      border: 1.5px solid var(--line);
      border-radius: 14px;
      font-family: inherit;
      font-size: 1.05rem;
      min-height: 52px;
      background: #fff;
      color: var(--ink);
      margin-bottom: 0.9rem;
    }
    input:focus { outline: none; border-color: var(--teal); box-shadow: 0 0 0 3px var(--focus); }
    fieldset { border: 0; padding: 0; margin: 0 0 1rem; text-align: left; }
    legend {
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--coral-deep);
      margin-bottom: 0.55rem;
    }
    .choices { display: grid; gap: 0.5rem; }
    .choice {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.6rem;
      min-height: 52px;
      padding: 0.7rem 0.9rem;
      border: 1.5px solid var(--line);
      border-radius: 14px;
      background: #fff;
      cursor: pointer;
      font-weight: 650;
    }
    .choice small { color: var(--muted); font-weight: 600; }
    .choice:has(input:checked) {
      border-color: var(--coral);
      background: #fff4ec;
      box-shadow: inset 3px 0 0 var(--coral);
    }
    .choice input { accent-color: var(--coral); width: 18px; height: 18px; }
    .status {
      margin-top: 0.9rem;
      padding: 0.85rem 0.95rem;
      border-radius: 14px;
      display: none;
      line-height: 1.45;
      text-align: left;
    }
    .status.visible { display: block; }
    .status.error { background: var(--error-bg); color: var(--error); }
    .back { margin-top: 1rem; }
    .back a { color: var(--navy); font-weight: 700; text-decoration: none; }
    html[data-theme="dark"] .card,
    html[data-theme="dark"] .choice,
    html[data-theme="dark"] input[type="text"] { background: #241811; color: var(--ink); border-color: #4a382f; }
    html[data-theme="dark"] .choice:has(input:checked) { background: #3a261e; }
    @media (max-width: 480px) {
      body { padding-top: 3.6rem; }
      input[type="text"] { font-size: 16px; }
    }
  </style>
</head>
<body>
  <button type="button" id="themeToggle" class="theme-toggle" aria-label="Switch to dark mode" aria-pressed="false"></button>
  <div class="shell">
    <div class="card">
      <h1 class="wordmark"><span class="sip">Sip</span><span class="amp">&amp;</span><span class="paint">Paint</span></h1>
      <p class="sub">Enter the name on your booking, and the package you booked, to open your dashboard.</p>
      <form id="verifyForm">
        <label for="name">Full name</label>
        <input id="name" name="name" type="text" autocomplete="name" autocapitalize="words" required>
        <fieldset>
          <legend>Your package</legend>
          <div class="choices" id="packageChoices"></div>
        </fieldset>
        <button type="submit" class="btn-primary" id="verifyBtn">View dashboard</button>
      </form>
      <div id="status" class="status" role="status" aria-live="polite"></div>
      <p class="back"><a href="index.html">← Back to check-in</a></p>
    </div>
    <footer class="site-credit">Designed &amp; Developed by Kutlo Molisana</footer>
  </div>
  <script src="theme.js"></script>
  <script>
    const TOKEN_KEY = 'guest_dashboard_token';
    const statusEl = document.getElementById('status');
    const verifyBtn = document.getElementById('verifyBtn');

    function showStatus(message) {
      statusEl.textContent = message;
      statusEl.className = 'status visible error';
    }

    function escapeHtml(value) {
      const div = document.createElement('div');
      div.textContent = value == null ? '' : String(value);
      return div.innerHTML;
    }

    async function loadPackages() {
      const box = document.getElementById('packageChoices');
      try {
        const res = await fetch('/api/packages');
        const data = await res.json();
        const packages = data.packages || [];
        if (!packages.length) {
          box.innerHTML = '<p>No packages are available yet. Please speak to the door team.</p>';
          return;
        }
        box.innerHTML = packages.map((pkg) => `
          <label class="choice">
            <span><input type="radio" name="package" value="${pkg.id}"> ${escapeHtml(pkg.name)}</span>
            ${pkg.price ? `<small>${escapeHtml(pkg.price)}</small>` : ''}
          </label>
        `).join('');
      } catch {
        box.innerHTML = '<p>Unable to load packages. Please try again.</p>';
      }
    }

    const reason = new URLSearchParams(window.location.search).get('reason');
    if (reason === 'revoked') {
      sessionStorage.removeItem(TOKEN_KEY);
      showStatus("You haven't checked in yet. Please complete your check-in before accessing your dashboard.");
    } else if (reason === 'session') {
      sessionStorage.removeItem(TOKEN_KEY);
      showStatus('Please verify your name again.');
    }

    document.getElementById('verifyForm').addEventListener('submit', async (event) => {
      event.preventDefault();
      const name = document.getElementById('name').value.trim();
      const chosen = document.querySelector('input[name="package"]:checked');
      if (!name) {
        showStatus('Please enter your name.');
        return;
      }
      if (!chosen) {
        showStatus('Please confirm the package you booked.');
        return;
      }
      verifyBtn.disabled = true;
      try {
        const res = await fetch('/api/guest-dashboard/verify', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, package: chosen.value })
        });
        const data = await res.json();
        if (!res.ok || !data.token) {
          showStatus(data.error || 'Please try again.');
          verifyBtn.disabled = false;
          return;
        }
        sessionStorage.setItem(TOKEN_KEY, data.token);
        window.location.href = 'guest-dashboard.html';
      } catch {
        showStatus('Unable to reach the server. Please try again.');
        verifyBtn.disabled = false;
      }
    });

    loadPackages();
  </script>
</body>
</html>
